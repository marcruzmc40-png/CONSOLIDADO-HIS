<title>Consolidado HIS · C.S. La Esperanza</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root{
    --azul-900:#0b2e4f; --azul-700:#124a78; --azul-500:#1c6ea4; --azul-100:#e8f1f8;
    --verde-600:#2f8f4e; --gris-900:#1c2430; --gris-600:#5b6675; --gris-300:#d7dee6;
    --gris-100:#f4f7fa; --blanco:#ffffff; --radio:9px;
    --sombra:0 1px 3px rgba(11,46,79,.08), 0 1px 2px rgba(11,46,79,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--gris-100); color:var(--gris-900);
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    line-height:1.45; font-size:14px;}
  header{background:linear-gradient(135deg, var(--azul-900), var(--azul-700)); color:#fff; padding:14px 18px;}
  header .wrap{max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  header h1{margin:0; font-size:1.05rem; font-weight:700;}
  header p{margin:0; color:#c9dcee; font-size:.76rem;}
  .badge{display:inline-block; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35);
    padding:1px 9px; border-radius:999px; font-size:.64rem; letter-spacing:.3px; text-transform:uppercase;}
  main{max-width:760px; margin:16px auto 40px; padding:0 16px;}
  .card{background:var(--blanco); border-radius:var(--radio); box-shadow:var(--sombra);
    border:1px solid var(--gris-300); padding:16px 18px; margin-bottom:14px;}
  select{width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--gris-300); font-size:.88rem; background:#fff;}
  label.lbl{font-size:.78rem; color:var(--gris-600); display:block; margin-bottom:5px; font-weight:600;}
  .resumen-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin:12px 0 4px;}
  .stat{background:var(--azul-100); border-radius:7px; padding:9px 11px;}
  .stat b{display:block; font-size:1.2rem; color:var(--azul-900); line-height:1.2;}
  .stat span{font-size:.68rem; color:var(--gris-600);}
  .btn{border:none; border-radius:7px; padding:9px 16px; font-size:.85rem; font-weight:600; cursor:pointer;}
  .btn-azul{background:var(--azul-500); color:#fff;}
  .btn-azul:hover{background:var(--azul-700);}
  .btn:disabled{background:var(--gris-300); color:#8b95a3; cursor:not-allowed;}
  .descargas{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  table.previa{border-collapse:collapse; width:100%; font-size:.72rem; margin-top:10px;}
  table.previa th, table.previa td{border:1px solid var(--gris-300); padding:4px 7px; text-align:left; white-space:nowrap;}
  table.previa th{background:var(--azul-100); position:sticky; top:0;}
  .scroll-tabla{max-height:280px; overflow:auto; border-radius:7px; border:1px solid var(--gris-300);}
  .estado{text-align:center; padding:40px 16px; color:var(--gris-600); font-size:.9rem;}
  footer{text-align:center; color:var(--gris-600); font-size:.7rem; padding:16px; max-width:760px; margin:0 auto;}
</style>
</head>

    e.style.display = "block";
    e.textContent = "No se pudo cargar la información (" + err.message + "). Si acabas de publicar, revisa que 'indice.json' y los archivos 'datos_*.json' estén en la misma carpeta que esta página.";
  }
}

function armarSelector(){
  const lista = INDICE.establecimientos || [];
  const select = document.getElementById("selectEstablecimiento");
  select.innerHTML = lista.map((e,i)=>'<option value="'+i+'">'+e.nombre+' — '+e.filas.toLocaleString("es-PE")+' filas</option>').join("");
  const totalGeneral = lista.reduce((s,e)=>s+e.filas,0);
  document.getElementById("statTotalEstab").textContent = lista.length.toLocaleString("es-PE");
  document.getElementById("statTotalGeneral").textContent = totalGeneral.toLocaleString("es-PE");
  select.onchange = cargarEstablecimientoSeleccionado;
  if(lista.length){ select.value = "0"; cargarEstablecimientoSeleccionado(); }
}

async function cargarEstablecimientoSeleccionado(){
  const idx = Number(document.getElementById("selectEstablecimiento").value);
  const entrada = INDICE.establecimientos[idx];
  document.getElementById("statFilas").textContent = "...";
  document.getElementById("tablaPreview").innerHTML = "";
  try{
    const partes = await Promise.all(entrada.archivos.map(nombreArchivo =>
      fetch(nombreArchivo, {cache:"no-store"}).then(r=>{
        if(!r.ok) throw new Error("No se encontró " + nombreArchivo);
        return r.json();
      })
    ));
    const filas = [].concat(...partes.map(p=>p.filas));
    ESTAB_ACTUAL = { headers: INDICE.headers, filas };
    actualizarVista();
  } catch(err){
    document.getElementById("statFilas").textContent = "0";
    alert("No se pudo cargar ese establecimiento (" + err.message + ").");
  }
}

function actualizarVista(){
  if(!ESTAB_ACTUAL) return;
  const filas = ESTAB_ACTUAL.filas;
  document.getElementById("statFilas").textContent = filas.length.toLocaleString("es-PE");

  const tabla = document.getElementById("tablaPreview");
  let html = "<thead><tr>" + ESTAB_ACTUAL.headers.map(h=>"<th>"+h+"</th>").join("") + "</tr></thead><tbody>";
  for(const fila of filas.slice(0,50)){
    html += "<tr>" + fila.map(v=>"<td>"+(v===undefined||v===null?"":String(v).replace(/</g,"&lt;"))+"</td>").join("") + "</tr>";
  }
  html += "</tbody>";
  tabla.innerHTML = html;
}

function nombreArchivo(ext){
  const opt = document.getElementById("selectEstablecimiento");
  const idx = Number(opt.value);
  const nombre = (INDICE.establecimientos[idx] && INDICE.establecimientos[idx].nombre) || "ESTABLECIMIENTO";
  const sufijo = String(nombre).replace(/[\\/:*?"<>|]+/g, "").trim().slice(0,60);
  const fecha = new Date().toISOString().slice(0,10);
  return "BD ARCHIVO PLANO " + sufijo + "_" + fecha + "." + ext;
}

function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Columnas de apellidos/nombres de Paciente, Personal y Registrador que se ocultan
// en la descarga "con datos ocultos" (protección de datos personales).
const COLUMNAS_A_OCULTAR = new Set([
  "Apellido_Paterno_Paciente","Apellido_Materno_Paciente","Nombres_Paciente",
  "Apellido_Paterno_Personal","Apellido_Materno_Personal","Nombres_Personal",
  "Apellido_Paterno_Registrador","Apellido_Materno_Registrador","Nombres_Registrador",
]);

function enmascarar(valor){
  const s = (valor===undefined||valor===null) ? "" : String(valor).trim();
  if(s.length === 0) return s;
  if(s.length <= 3) return "*".repeat(s.length);
  return s.slice(0,3) + "******";
}

function datosConOcultamiento(headers, filas){
  const indices = headers.map((h,i)=> COLUMNAS_A_OCULTAR.has(h) ? i : -1).filter(i=>i!==-1);
  return filas.map(fila=>{
    const copia = fila.slice();
    for(const i of indices) copia[i] = enmascarar(copia[i]);
    return copia;
  });
}

async function generarExcelVisor(datos, sufijoNombre, btn){
  const original = btn.textContent;
  try{
    if(typeof XLSX === "undefined"){
      alert("No se pudo cargar el generador de Excel.");
      return;
    }
    btn.disabled = true; btn.textContent = "Generando...";
    await new Promise(r=>setTimeout(r,20));
    const aoa = [ESTAB_ACTUAL.headers, ...datos];
    const ws = XLSX.utils.aoa_to_sheet(aoa, {dense:true});
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Consolidado");
    XLSX.writeFile(wb, nombreArchivo("xlsx").replace(".xlsx", sufijoNombre + ".xlsx"));
  } catch(err){
    alert("No se pudo generar el Excel (" + err.message + ").");
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

document.getElementById("btnXLSXOculto").addEventListener("click", async ()=>{
  if(!ESTAB_ACTUAL) return;
  const datos = datosConOcultamiento(ESTAB_ACTUAL.headers, ESTAB_ACTUAL.filas);
  await generarExcelVisor(datos, "_datos_ocultos", document.getElementById("btnXLSXOculto"));
});

cargar();
